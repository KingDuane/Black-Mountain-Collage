<!doctype html>
<!--
  “This is not a field where one paints a painting which will be looked at for centuries. This is a field where one does his work and in ten years it is obsolete. It’s sort of like a sediment of rocks. You’re building up a mountain and you get to contribute your little layer of sedimentary rock to make the mountain that much higher. No one will see it, but they will stand on it. You can’t appreciate it from the top of the mountain but it’ll be appreciated by that rare geologist.” —Steve Jobs
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>The Medium is the Collage</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--page-bg, #fff); }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <canvas aria-label="Move or drag to position the seal; tap or click to add a new layer and invert the background."></canvas>

    const canvas = document.querySelector('canvas');
    const context = canvas.getContext('2d', { alpha: false });
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    // A slightly lower simulation cadence on phones offsets the finer grid.
    // Particle size and visual detail are independent of update frequency.
    const FRAME_MS = Math.min(innerWidth, innerHeight) < 700 ? 33 : 16;
    const MAX_STEPS_PER_FRAME = 4;
    const ROTATION_FRAMES = 90 * 60;
    const EROSION_FRACTION = 0.003;
    const THRESHOLD = 135;

    let width = 0;
    let height = 0;
    let cells;
    let frameImage;
    let sourcePixels = [];
    let sourceTemplate = [];
    let halfSize = 0;
    let centerX = 0;
    let centerY = 0;
    let pointerX = null;
    let pointerY = null;
    let rotation = 0;
    let background = 255;
    let ink = 1; // 1 = black; 2 = white; 0 = empty.

    // Match Safari’s top and bottom browser chrome to the artwork.
    // The canvas stays in the visual viewport; the document color fills safe areas.
    const themeColor = document.querySelector('meta[name="theme-color"]');
    function syncBrowserColor() {
      const color = background === 0 ? '#000000' : '#ffffff';
      document.documentElement.style.setProperty('--page-bg', color);
      themeColor.setAttribute('content', color);
    }
    let lastTime = 0;
    let accumulatedTime = 0;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function positionSeal(x, y) {
      // Keep the seal inside the viewport when possible.
      const marginX = Math.min(halfSize + 2, width / 2);
      const marginY = Math.min(halfSize + 2, height / 2);
      centerX = Math.round(clamp(x, marginX, width - marginX));
      centerY = Math.round(clamp(y, marginY, height - marginY));
    }

    function pointerPosition(event) {
      const bounds = canvas.getBoundingClientRect();
      pointerX = (event.clientX - bounds.left) * width / bounds.width;
      pointerY = (event.clientY - bounds.top) * height / bounds.height;
    }

    function initialize() {
      // Internal resolution is capped to avoid extreme memory consumption.
      const isTouchSized = Math.min(innerWidth, innerHeight) < 700;
      // Keep fine-grained sand on phones too. The previous 0.9 scale
      // discarded more than half the available pixel detail on Retina screens.
      // Limit the grid to protect mobile memory and CPU usage.
      // A denser desktop grid makes each grain smaller and reduces
      // the visible pixel pattern as the seal rotates. Mobile is unchanged.
      const scale = Math.min(isTouchSized ? 1.65 : 1.85,
        (isTouchSized ? 900 : 1900) / innerWidth,
        (isTouchSized ? 1500 : 1450) / innerHeight);
      width = Math.max(1, Math.round(innerWidth * scale));
      height = Math.max(1, Math.round(innerHeight * scale));
      canvas.width = width;
      canvas.height = height;
      context.imageSmoothingEnabled = false;

      cells = new Uint8Array(width * height);
      frameImage = context.createImageData(width, height);
      background = 255;
      syncBrowserColor();
      ink = 1;
      rotation = 0;
      halfSize = Math.round(Math.min(width * (isTouchSized ? 0.42 : 0.30), height * (isTouchSized ? 0.48 : 0.34)) / 2);
      positionSeal(pointerX ?? width / 2, pointerY ?? height / 2);

      // Rasterize the seal once, then reuse its pixel coordinates on clicks.
      const side = halfSize * 2;
      const offscreen = document.createElement('canvas');
      offscreen.width = side;
      offscreen.height = side;
      const offscreenContext = offscreen.getContext('2d', { willReadFrequently: true });
      offscreenContext.fillStyle = '#fff';
      offscreenContext.fillRect(0, 0, side, side);
      const ratio = sealImage.naturalWidth / sealImage.naturalHeight;
      const drawWidth = ratio > 1 ? side : side * ratio;
      const drawHeight = ratio > 1 ? side / ratio : side;
      offscreenContext.drawImage(
        sealImage, (side - drawWidth) / 2, (side - drawHeight) / 2,
        drawWidth, drawHeight
      );

      const rgba = offscreenContext.getImageData(0, 0, side, side).data;
      sourceTemplate = [];
      for (let y = 0; y < side; y++) {
        for (let x = 0; x < side; x++) {
          if (rgba[(y * side + x) * 4] < THRESHOLD) {
            sourceTemplate.push({ x: x - halfSize, y: y - halfSize });
          }
        }
      }
      sourcePixels = sourceTemplate.slice();
      lastTime = 0;
      accumulatedTime = 0;
      render();
    }

    function releaseAllOrSome(all = false) {
      if (!sourcePixels.length) return;
      const sine = Math.sin(rotation);
      const cosine = Math.cos(rotation);
      const count = all
        ? sourcePixels.length
        : Math.max(1, Math.ceil(sourcePixels.length * EROSION_FRACTION));

      for (let n = 0; n < count && sourcePixels.length; n++) {
        let index = Math.floor(Math.random() * sourcePixels.length);
        if (!all) {
          // Bias erosion toward the lower edge of the rotating seal.
          for (let attempt = 0; attempt < 3; attempt++) {
            const candidate = Math.floor(Math.random() * sourcePixels.length);
            const a = sourcePixels[candidate];
            const b = sourcePixels[index];
            if (a.x * sine + a.y * cosine > b.x * sine + b.y * cosine) {
              index = candidate;
            }
          }
        }
        const pixel = sourcePixels[index];
        sourcePixels[index] = sourcePixels[sourcePixels.length - 1];
        sourcePixels.pop();

        const x = Math.round(centerX + pixel.x * cosine - pixel.y * sine);
        const y = Math.round(centerY + pixel.x * sine + pixel.y * cosine);
        if (x >= 0 && x < width && y >= 0 && y < height) {
          const offset = y * width + x;
          if (!cells[offset]) cells[offset] = ink;
        }
      }
    }

    function simulate() {
      // Bottom-up update: a grain can move down or diagonally into empty space.
      // Alternate horizontal scan direction to avoid a persistent sideways bias.
      const reverse = Math.random() < 0.5;
      for (let y = height - 2; y >= 0; y--) {
        for (let x = reverse ? width - 1 : 0;
          reverse ? x >= 0 : x < width;
          x += reverse ? -1 : 1) {
          const index = y * width + x;
          const grain = cells[index];
          if (!grain) continue;
          const below = index + width;
          if (!cells[below]) {
            cells[below] = grain;
            cells[index] = 0;
            continue;
          }
          const direction = Math.random() < 0.5 ? -1 : 1;
          if (x + direction >= 0 && x + direction < width && !cells[below + direction]) {
            cells[below + direction] = grain;
            cells[index] = 0;
          } else if (x - direction >= 0 && x - direction < width && !cells[below - direction]) {
            cells[below - direction] = grain;
            cells[index] = 0;
          }
        }
      }
      if (sourcePixels.length) {
        rotation += Math.PI * 2 / ROTATION_FRAMES;
        releaseAllOrSome();
      }
    }

    function render() {
      const rgba = frameImage.data;
      for (let i = 0; i < cells.length; i++) {
        const shade = cells[i] === 1 ? 0 : cells[i] === 2 ? 255 : background;
        const index = i * 4;
        rgba[index] = rgba[index + 1] = rgba[index + 2] = shade;
        rgba[index + 3] = 255;
      }
      const sine = Math.sin(rotation);
      const cosine = Math.cos(rotation);
      const shade = ink === 1 ? 0 : 255;
      for (const pixel of sourcePixels) {
        const x = Math.round(centerX + pixel.x * cosine - pixel.y * sine);
        const y = Math.round(centerY + pixel.x * sine + pixel.y * cosine);
        if (x < 0 || x >= width || y < 0 || y >= height) continue;
        const index = (y * width + x) * 4;
        rgba[index] = rgba[index + 1] = rgba[index + 2] = shade;
      }
      context.putImageData(frameImage, 0, 0);
    }

    function animate(time) {
      if (!lastTime) lastTime = time;
      accumulatedTime += Math.min(100, time - lastTime);
      lastTime = time;
      if (!document.hidden && !prefersReducedMotion.matches && accumulatedTime >= FRAME_MS) {
        const steps = Math.min(MAX_STEPS_PER_FRAME, Math.floor(accumulatedTime / FRAME_MS));
        accumulatedTime -= steps * FRAME_MS;
        for (let i = 0; i < steps; i++) simulate();
        render();
      }
      requestAnimationFrame(animate);
    }

    // A mouse steers continuously. On touchscreens, drag to steer;
    // a stationary tap adds a new contrasting layer.
    let activePointer = null;
    let startX = 0;
    let startY = 0;
    let didDrag = false;

    function addLayer(event) {
      pointerPosition(event);
      releaseAllOrSome(true);
      background = background === 255 ? 0 : 255;
      syncBrowserColor();
      ink = ink === 1 ? 2 : 1;
      sourcePixels = sourceTemplate.slice();
      positionSeal(pointerX, pointerY);
      rotation = 0;
      render();
    }

    canvas.addEventListener('pointerdown', (event) => {
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      activePointer = event.pointerId;
      startX = event.clientX;
      startY = event.clientY;
      didDrag = false;
      pointerPosition(event);
      positionSeal(pointerX, pointerY);
      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener('pointermove', (event) => {
      if (event.pointerType !== 'mouse' && activePointer !== event.pointerId) return;
      if (activePointer === event.pointerId &&
          Math.hypot(event.clientX - startX, event.clientY - startY) > 9) {
        didDrag = true;
      }
      pointerPosition(event);
      positionSeal(pointerX, pointerY);
    });

    canvas.addEventListener('pointerup', (event) => {
      if (event.pointerId !== activePointer) return;
      if (!didDrag) addLayer(event);
      activePointer = null;
    });

    canvas.addEventListener('pointercancel', () => { activePointer = null; });

    // Preserve accumulated sediment, source erosion, and inversion on resize.
    // Reproject the old grid into the new grid rather than restarting the artwork.
    let resizeTimeout;
    addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        if (!cells) return;
        const oldWidth = width;
        const oldHeight = height;
        const oldCells = cells;
        const oldCenterX = centerX;
        const oldCenterY = centerY;
        const oldHalfSize = halfSize;
        const oldSource = sourcePixels;
        const oldBackground = background;
        const oldInk = ink;
        const oldRotation = rotation;
        initialize();
        const xRatio = width / oldWidth;
        const yRatio = height / oldHeight;
        for (let y = 0; y < oldHeight; y++) {
          for (let x = 0; x < oldWidth; x++) {
            const grain = oldCells[y * oldWidth + x];
            if (!grain) continue;
            const nx = Math.min(width - 1, Math.floor(x * xRatio));
            const ny = Math.min(height - 1, Math.floor(y * yRatio));
            cells[ny * width + nx] = grain;
          }
        }
        background = oldBackground;
        syncBrowserColor();
        ink = oldInk;
        rotation = oldRotation;
        const remaining = oldSource.length / Math.max(1, sourceTemplate.length);
        // Preserve the erosion fraction and shape by matching normalized positions.
        const surviving = new Set(oldSource.map(p => `${p.x},${p.y}`));
        sourcePixels = sourceTemplate.filter(p => surviving.has(
          `${Math.round(p.x * oldHalfSize / halfSize)},${Math.round(p.y * oldHalfSize / halfSize)}`));
        // Resampling can miss coordinates; retain an approximate amount if necessary.
        if (!sourcePixels.length && remaining > 0.01) {
          sourcePixels = sourceTemplate.slice(0, Math.round(sourceTemplate.length * remaining));
        }
        positionSeal(oldCenterX * xRatio, oldCenterY * yRatio);
        render();
      }, 220);
    });

    sealImage.addEventListener('load', () => {
      initialize();
      requestAnimationFrame(animate);
    }, { once: true });
  })();
  </script>
